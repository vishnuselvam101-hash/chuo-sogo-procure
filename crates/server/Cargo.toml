[package]
name = "procure-server"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "procure-server"
path = "src/main.rs"

[dependencies]
procure-domain = { path = "../domain" }
procure-ai = { path = "../ai" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "fs", "io-util", "process", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "limit", "timeout", "sensitive-headers", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
aes-gcm = "0.10"
ipnet = "2"
thiserror = "2"
utoipa = { version = "5.5", features = ["uuid", "chrono"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
krilla = "0.8.2"
skrifa = "0.42.1"
imagesize = "0.14"
calamine = "0.38.0"
encoding_rs = "0.8.44"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1-rustls-tls"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
futures-util = "0.3"

[dev-dependencies]
http-body-util = "0.1"

[lints]
workspace = true
