# Unsigned desktop installers for Windows, macOS and Linux. Manual trigger only
# (macOS runner minutes are expensive on private repos). Signing/notarisation need
# certificates the founder has not provisioned yet; outputs are for internal testing.
# No build cache here: installers are built from a clean state (cache-poisoning risk).
name: desktop-build
# `app: admin` builds the staff-only admin console (separate identifier, /api/admin/v1 only).
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build
        type: choice
        options: [business, admin]
        default: business
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: msi,nsis
          - os: macos-latest
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - working-directory: apps/desktop
        if: inputs.app != 'admin'
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: cargo tauri build --bundles "$BUNDLES"
      - working-directory: apps/desktop
        if: inputs.app == 'admin'
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: cargo tauri build --config src-tauri/tauri.admin.conf.json --features admin --bundles "$BUNDLES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chuo-sogo-procure-${{ inputs.app }}-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
          retention-days: 14
