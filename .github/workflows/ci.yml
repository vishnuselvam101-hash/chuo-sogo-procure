# Quality gate on every push/PR (Linux). No secrets used; read-only token.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-not-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci-only-not-secret
      DATABASE_URL: postgres://procure:ci-owner@127.0.0.1:5432/procure_dev
      PROCURE_RUNTIME_DATABASE_URL: postgres://procure_app:ci-app@127.0.0.1:5432/procure_dev
      # Smaller debug builds: the full workspace with tests outgrew the runner's disk (the
      # linker died with SIGBUS when it ran out of space).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space (unused preinstalled SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: System packages (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev postgresql-client fonts-noto-cjk poppler-utils ffmpeg tesseract-ocr tesseract-ocr-jpn
      - name: Database roles
        env:
          PROCURE_OWNER_PASSWORD: ci-owner
          PROCURE_APP_PASSWORD: ci-app
        run: bash scripts/db-setup.sh
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - name: Quality gate (quick)
        run: scripts/gate.sh quick
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-reports
          path: reports/
          retention-days: 14
