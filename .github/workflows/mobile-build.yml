# Android and iOS test builds. Manual trigger only (macOS minutes are expensive on private
# repos). Nothing is signed for distribution:
#   Android: debug APK (Android debug key) for internal installs only.
#   iOS: simulator build only; device/TestFlight builds need an Apple Developer account and
#   signing identity the founder has not provisioned.
# The generated mobile projects (src-tauri/gen) are recreated here from tauri.conf.json.
name: mobile-build
# `app: shop` builds the consumer shop (Chuo-Sogo Shop) instead of the business app.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to build
        type: choice
        options: [business, shop]
        default: business
      server:
        description: Server address new installations connect to (empty = none preset)
        type: string
        default: ""
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Gradle needs JDK 17+; the runner's default is 11.
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - working-directory: apps/desktop
        env:
          CONFIG: ${{ inputs.app == 'shop' && '--config src-tauri/tauri.shop.conf.json' || '' }}
          PROCURE_DEFAULT_SERVER: ${{ inputs.server || null }}
        # Xcode/Gradle drop the environment before cargo runs; build.rs reads this file instead.
        run: |
          if [ -n "${PROCURE_DEFAULT_SERVER:-}" ]; then printf '%s' "$PROCURE_DEFAULT_SERVER" > src-tauri/default-server.txt; fi
          cargo tauri android init --ci $CONFIG
          # Optimised build (a debug APK is ~150 MB); release APKs come out unsigned.
          cargo tauri android build --apk --target aarch64 $CONFIG
      # Test signature only: a throwaway key made on this runner, the same trust level as a
      # debug build. Store releases need the founder's real upload key (not provisioned).
      - name: Sign with a throwaway test key
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.keystore" -storepass android -keypass android \
            -alias test -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Chuo-Sogo test build" >/dev/null
          mapfile -t apks < <(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk')
          [ "${#apks[@]}" -eq 1 ] || { echo "expected one unsigned APK, found ${#apks[@]}" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/apk"
          "$BT/zipalign" -f -p 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/test.keystore" --ks-pass pass:android \
            --out "$RUNNER_TEMP/apk/chuo-sogo-${{ inputs.app }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/apk/chuo-sogo-${{ inputs.app }}.apk"
          rm -f "$RUNNER_TEMP/test.keystore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chuo-sogo-${{ inputs.app }}-android
          path: ${{ runner.temp }}/apk/*.apk
          retention-days: 14

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - working-directory: apps/desktop
        env:
          CONFIG: ${{ inputs.app == 'shop' && '--config src-tauri/tauri.shop.conf.json' || '' }}
          PROCURE_DEFAULT_SERVER: ${{ inputs.server || null }}
        # Xcode/Gradle drop the environment before cargo runs; build.rs reads this file instead.
        run: |
          if [ -n "${PROCURE_DEFAULT_SERVER:-}" ]; then printf '%s' "$PROCURE_DEFAULT_SERVER" > src-tauri/default-server.txt; fi
          cargo tauri ios init --ci $CONFIG
          cargo tauri ios build --debug --target aarch64-sim $CONFIG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chuo-sogo-${{ inputs.app }}-ios-simulator
          path: |
            apps/desktop/src-tauri/gen/apple/build/**/*.app
            apps/desktop/src-tauri/gen/apple/build/**/*.zip
          retention-days: 14
