[workspace]
resolver = "3"
members = ["crates/domain", "crates/ai", "crates/server", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Debug builds keep line numbers only (backtraces still point at the code): full debug info
# made target/debug grow to tens of GB on the shared server.
[profile.dev]
debug = "line-tables-only"
